    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary: #002b5c; --accent: #00d4ff; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --bg: #f8fafc; --purple: #8b5cf6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); padding: 10px; color: #1e293b; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        @keyframes pulse-heart { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes stockBlink { 0% { background-color: #fee2e2; } 50% { background-color: transparent; } 100% { background-color: #fee2e2; } }
        
        .heart-blink { color: #ff4d4d; display: inline-block; animation: pulse-heart 0.8s infinite; margin-left: 3px; }
        
        header { 
            background: var(--primary); color: white; padding: 15px 20px; border-radius: 15px; margin-bottom: 15px; 
            box-shadow: 0 4px 12px rgba(0, 43, 92, 0.2);
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; }
        .header-info h2 { font-size: 1.4rem; margin: 0; }
        .header-info small { color: var(--accent); font-weight: 800; text-transform: uppercase; font-size: 0.7rem; display: block; }
        .logout-btn { background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem; padding: 5px; }
        .slogan-container { width: 100%; display: flex; justify-content: center; align-items: center; padding-top: 5px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .slogan { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #ffffff; }

        .card { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .grid-kpi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .kpi-card { background: white; padding: 12px; border-radius: 15px; border-left: 5px solid var(--accent); position: relative; }
        .kpi-card span { display: block; font-size: 0.65rem; color: #64748b; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
        .kpi-card b { font-size: 1.1rem; color: var(--primary); }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-ghost { background: #f1f5f9; color: #64748b; margin-top: 8px; }
        
        input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #e2e8f0; margin-bottom: 10px; outline: none; background: #fff; font-size: 0.9rem; }
        .hidden { display: none !important; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10000; padding: 20px; backdrop-filter: blur(5px); }
        .status-tag { font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
        .tag-open { background: #fee2e2; color: #ef4444; }
        .tag-progress { background: #fef3c7; color: #d97706; animation: blink 1s infinite; border: 1px solid #fcd34d; display: inline-flex; align-items: center; gap: 5px; }
        .low-stock-alert { animation: stockBlink 1.5s infinite; border: 1.5px solid #ef4444 !important; }
        
        .stock-table { width: 100%; border-collapse: collapse; }
        .stock-table td { padding: 12px; border-bottom: 1px solid #eee; }
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f1f5f9; background: #fff; border-radius: 8px; margin-bottom: 5px; }
        .user-actions i { cursor: pointer; margin-left: 10px; padding: 5px; }
		.archive-item {
    border-left: 4px solid var(--primary);
    padding: 12px;
    margin-bottom: 12px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    position: relative;
}
.archive-item b { color: var(--primary); font-size: 1rem; display: block; margin-bottom: 4px; }
.archive-item .meta { font-size: 0.75rem; color: #64748b; font-weight: 600; display: flex; justify-content: space-between; margin-top: 8px; border-top: 1px solid #f1f5f9; padding-top: 5px; }
.archive-item .badge-proj { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; }
.archive-item .duration-tag { color: var(--success); font-weight: 800; }
    /* الخلفية الكاملة للشاشة */
#login-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #001a3d 0%, #002b5c 100%); /* تدرج أزرق غامق */
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(10px);
}

/* الكارط ديال الدخول */
#login-overlay .card {
    width: 360px;
    padding: 40px 30px;
    background: rgba(255, 255, 255, 0.95); /* أبيض شفاف شوية */
    border-radius: 28px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.3);
}

/* العنوان (GMAO CVG) */
#login-overlay h2 {
    color: #002b5c;
    font-size: 1.8rem;
    font-weight: 800;
    margin-bottom: 30px;
    letter-spacing: -1px;
}

/* الخانات (Inputs) */
#login-overlay input {
    width: 100%;
    padding: 15px 20px;
    margin-bottom: 15px;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    background: #f8fafc;
    font-size: 1rem;
    transition: all 0.3s ease;
}

#login-overlay input:focus {
    border-color: #00d4ff;
    background: #ffffff;
    outline: none;
    box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.15);
}

/* زر الدخول (ACCÉDER) */
#login-overlay .btn-warning {
    width: 100%;
    padding: 16px;
    background: #002b5c;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, background 0.3s;
    margin-top: 10px;
}

#login-overlay .btn-warning:hover {
    background: #003d82;
    transform: translateY(-2px);
}

#login-overlay .btn-warning:active {
    transform: translateY(0);
}

    </div>

    <div id="closeModal" class="modal"><div class="card" style="width:100%; max-width:400px;"><h3>Clôture d'intervention</h3><input type="hidden" id="modal-key"><input type="text" id="modal-tech-id" placeholder="Matricule Tech"><textarea id="modal-problem" placeholder="Problème"></textarea><textarea id="modal-solution" placeholder="Solution"></textarea><input list="spareparts" id="modal-piece" placeholder="Pièce (Optionnel)"><datalist id="spareparts"></datalist><input type="number" id="modal-qty" value="1"><button class="btn btn-success" onclick="confirmClosing()">TERMINER</button><button class="btn btn-ghost" onclick="document.getElementById('closeModal').style.display='none'">ANNULER</button></div></div>
    <div id="viewStockModal" class="modal" onclick="if(event.target == this) this.style.display='none'">
    <div class="card" style="width:100%; max-width:450px; max-height: 85vh; display: flex; flex-direction: column;">
        <h3>État du Stock</h3>
        
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <button class="btn" style="background:var(--primary); color:white; font-size:0.7rem; padding:8px;" onclick="filterStockDisplay('ALL')">TOUT</button>
            <button class="btn" style="background:#64748b; color:white; font-size:0.7rem; padding:8px;" onclick="filterStockDisplay('PIECE')">PIÈCES</button>
            <button class="btn" style="background:#8b5cf6; color:white; font-size:0.7rem; padding:8px;" onclick="filterStockDisplay('TOOL')">TOOLS</button>
        </div>

        <input type="text" id="stockSearchInput" placeholder="🔍 Rechercher..." onkeyup="searchStock()">
        
        <div id="stock-list" style="overflow-y:auto; flex-grow: 1;"></div>
        
        <button class="btn btn-ghost" onclick="document.getElementById('viewStockModal').style.display='none'">FERMER</button>
    </div>
</div>
    <div id="archiveModal" class="modal" onclick="if(event.target == this) this.style.display='none'"><div class="card" style="width:100%; max-width:600px;"><div id="archive-list" style="max-height:400px; overflow-y:auto;"></div></div></div>
   <div id="stockModal" class="modal" onclick="if(event.target == this) this.style.display='none'">
    <div class="card" style="width:100%; max-width:400px;">
        <h3>Ajouter Catalogue</h3>
        
        <label style="font-size: 0.8rem; font-weight: 800;">CATÉGORIE :</label>
        <select id="cat-type" onchange="updateCatalogueList()">
            <option value="PIECE">PIÈCES DE RECHANGE</option>
            <option value="TOOL">TOOLS (OUTILLAGE)</option>
        </select>

        <label style="font-size: 0.8rem; font-weight: 800;">ARTICLE :</label>
        <select id="new-p-name">
            <option value="">-- Sélectionner --</option>

        <input type="number" id="new-p-qty" placeholder="Quantité">

    </div>
</div>

    <audio id="alertSound" loop src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script>
        const machineData = { "SKODA A8": ["80005631", "80007235", "80007236", "80007237", "80007238", "80007239", "80007240", "80007241", "80007242", "80007243", "80007244", "80007245", "80007246"], "CRAFTER": ["80003403", "80003857", "80006951", "80006953", "80007608", "80008117", "80008118", "80008119", "80008120", "80008121", "80008122", "80008125", "8000818431"], "G.CALIFORNIA": ["80006958"] };
        const firebaseConfig = { apiKey: "AIzaSyASQa5cLXFllnV6EmYp-ARZ9dndWSKha6c", authDomain: "cvgmaroc-gmao.firebaseapp.com", databaseURL: "https://cvgmaroc-gmao-default-rtdb.firebaseio.com", projectId: "cvgmaroc-gmao", storageBucket: "cvgmaroc-gmao.firebasestorage.app", messagingSenderId: "72908747564", appId: "1:72908747564:web:82f646ef5dd209d03b7289" };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let currentUser = null, allData = [], myChart = null;

        function handleLogin() {
            const u = document.getElementById('login-user').value.trim().toLowerCase(), p = document.getElementById('login-pass').value;
            if(u === "admin" && p === "3333") return startApp("MANAGER");
            database.ref('users/').once('value', snap => {
                let found = false;
                if(snap.val()) Object.values(snap.val()).forEach(usr => { if(usr.name.toLowerCase() === u && usr.pass === p) { found = true; startApp(usr.role); } });
                if(!found) alert("Accès Refusé");
            });
        }

        function startApp(role) {
            currentUser = role;
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('roleText').innerText = role;
            listenFirebase(); listenStock(); listenUsers();
            if(role === "MANAGER" || role === "MAINTENANCE") document.getElementById('manager-panel').classList.remove('hidden');
            if(role === "OPERATEUR") { document.getElementById('op-panel').classList.remove('hidden'); updateMachineList(); }
            setInterval(updateLiveTimers, 1000);
        }

        function listenFirebase() { database.ref('pannes/').on('value', snap => { allData = snap.val() ? Object.entries(snap.val()).map(([key, val]) => ({key, ...val})) : []; renderUI(); renderArchives(); updateStats(); if(currentUser !== "OPERATEUR") updateCharts(); }); }
        
        function renderUI() {
            const container = document.getElementById('pannes-list'); container.innerHTML = "";
            const actives = allData.filter(p => p.status !== 'CLOSED');
            if(document.getElementById('m-charge')) document.getElementById('m-charge').innerText = actives.length;
            actives.reverse().forEach(p => {
                let isWaiting = p.status === 'OPEN';
                let actionBtn = (currentUser === 'MAINTENANCE') ? (isWaiting ? `<button class="btn btn-warning" onclick="takeCharge('${p.key}')">Reçu</button>` : `<button class="btn btn-success" onclick="openRepriseModal('${p.key}')">TERMINER</button>`) : "";
                container.innerHTML += `<div class="card" style="border-left:5px solid ${isWaiting?'var(--danger)':'var(--warning)'}"><div style="display:flex; justify-content:space-between"><b>${p.mach}</b>${isWaiting?'<span class="status-tag tag-open">EN ARRÊT</span>':'<span class="status-tag tag-progress">RÉPARATION...</span>'}</div><small>${p.proj}</small><div style="margin:10px 0; padding:8px; background:#f1f5f9; border-radius:12px; text-align:center;"><b class="live-timer" data-start="${p.startTs}">00:00:00</b></div><div>${actionBtn}</div></div>`;
            });
            const sound = document.getElementById('alertSound');
            if(actives.some(p => p.status === 'OPEN') && currentUser !== 'OPERATEUR') sound.play().catch(()=>{}); else { sound.pause(); sound.currentTime = 0; }
        }

        function takeCharge(key) { database.ref('pannes/'+key).update({ status: 'IN_PROGRESS', recuTime: new Date().toLocaleString() }); }
        function openRepriseModal(key) { document.getElementById('modal-key').value = key; document.getElementById('closeModal').style.display='flex'; }
        
        function confirmClosing() {
            const key = document.getElementById('modal-key').value, tech = document.getElementById('modal-tech-id').value, prob = document.getElementById('modal-problem').value, sol = document.getElementById('modal-solution').value, piece = document.getElementById('modal-piece').value.toUpperCase(), qty = parseInt(document.getElementById('modal-qty').value) || 0;
            const item = allData.find(x => x.key === key), duration = Math.round((Date.now() - item.startTs) / 60000);
            database.ref('pannes/'+key).update({ status: 'CLOSED', duration, techId: tech, problem: prob, solution: sol, piece, qty, doneTime: new Date().toLocaleString() }).then(() => {
                if(piece) { const sRef = database.ref('stock/'+piece); sRef.once('value', s => { if(s.exists()) sRef.update({qty: Math.max(0, s.val().qty - qty)}); }); }
                document.getElementById('closeModal').style.display='none';
            });
        }

        function handlePanneSignal() { const proj = document.getElementById('in-proj').value, mach = document.getElementById('in-mach').value; database.ref('pannes/').push({proj, mach, status:'OPEN', startTs:Date.now(), dateStr:new Date().toLocaleString()}); }
        function updateMachineList() { const p = document.getElementById('in-proj').value, s = document.getElementById('in-mach'); s.innerHTML = ""; (machineData[p] || []).forEach(m => s.innerHTML += `<option value="${m}">${m}</option>`); }
        function updateLiveTimers() { document.querySelectorAll('.live-timer').forEach(el => { const start = parseInt(el.getAttribute('data-start')), diff = Math.floor((Date.now() - start) / 1000), h = Math.floor(diff/3600), m = Math.floor((diff%3600)/60), s = diff%60; el.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }); }
//MTTR-MTBF*****************************************************

// MTTR:  (كيحسب المعدل بالدقائق).

//MTBF: زدت ليك منطق كيحسب الساعات الكلية اللي دازت من أول "Arrêt" تسجل فالسيستيم وقسمناها على عدد الأعطال. هادشي كيعطيك فكرة شحال من ساعة كتدوز الماكينة بلا مشاكل.

//Protection: زدت شرط بلي الـ MTBF ميبدا يتحسب حتى يوقعو على الأقل 2 أعطال (حيت منطقياً ميمكنش تحسب "المسافة بين الأعطال" وأنت عندك غير عطل واحد)

function updateStats() {
    const closed = allData.filter(p => p.status === 'CLOSED');
    let totalRepairTime = 0;
    
    // حساب مجموع وقت الإصلاح
    closed.forEach(p => totalRepairTime += p.duration || 0);

    // 1. تحديث عدد التدخلات
    document.getElementById('m-count').innerText = closed.length;

    // 2. حساب MTTR (بالمينيت)
    const mttr = closed.length > 0 ? Math.round(totalRepairTime / closed.length) : 0;
    document.getElementById('m-mttr').innerText = mttr;

    // 3. حساب MTBF (بالساعات)
    if (closed.length > 1) {
        // كنجيبو أوع فالتاريخ وآخر عطل
        const timestamps = closed.map(p => p.startTs);
        const firstFailure = Math.min(...timestamps);
        const lastFailure = Math.max(...timestamps);
        
        // الوقت الكلي للتشغيل (بالساعات) من أول عطل حتى لدابا
        const totalOperatingTimeHours = (Date.now() - firstFailure) / (1000 * 60 * 60);
        
        // MTBF = الوقت الكلي / عدد الأعطال
        const mtbf = Math.round(totalOperatingTimeHours / closed.length);
        document.getElementById('m-mtbf').innerText = mtbf;
    } else {
        document.getElementById('m-mtbf').innerText = "---"; // مازال خاص كتر من عطل واحد باش يتحسب
    }
}

        function updateCharts() { const ctx = document.getElementById('downtimeChart').getContext('2d'), dataMap = {}; allData.filter(p => p.status === 'CLOSED').forEach(p => { const label = p.mach; dataMap[label] = (dataMap[label] || 0) + (p.duration || 0); }); if(myChart) myChart.destroy(); myChart = new Chart(ctx, { type:'bar', data: { labels: Object.keys(dataMap), datasets:[{label:'Min', data:Object.values(dataMap), backgroundColor:'#00d4ff'}] }, options:{responsive:true, plugins:{legend:{display:false}}}}); }

        // --- EXCEL CVG REPORT WITH MONTH FOR DASHBOARD ---
        function exportToExcel() {
            const closedData = allData.filter(p => p.status === 'CLOSED');
            const formattedData = closedData.map(p => {
                const dateObj = new Date(p.startTs);
                return {
                    "DATE": p.dateStr || '',
                    "MOIS": dateObj.toLocaleString('fr-FR', { month: 'long' }).toUpperCase(),
                    "PROJECT": p.proj || '',
                    "MACHINE": p.mach || '',
                    "RECU": p.recuTime || '',
                    "DONE": p.doneTime || '',
                    "TECH ID": p.techId || '',
                    "PROBLEME": p.problem || '',
                    "SOLUTION": p.solution || '',
                    "DOWNTIME (Min)": p.duration || 0
                };
            });
            const ws = XLSX.utils.json_to_sheet(formattedData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "DATA_GMAO");
            XLSX.writeFile(wb, "GMAO_CVG_REPORT_ANALYTICS.xlsx");
        }

        function listenUsers() {
            database.ref('users/').on('value', snap => {
                const c = document.getElementById('users-list-container'); c.innerHTML = "";
                if(snap.val()) Object.entries(snap.val()).forEach(([k, u]) => { c.innerHTML += `<div class="user-item"><span><b>${u.name}</b> (${u.role})</span><div class="user-actions"><i class="fas fa-edit" style="color:var(--primary)" onclick="editUser('${k}', '${u.name}', '${u.pass}', '${u.role}')"></i><i class="fas fa-trash" style="color:red" onclick="database.ref('users/${k}').remove()"></i></div></div>`; });
            });
        }
        function editUser(key, name, pass, role) {
            document.getElementById('edit-user-key').value = key; document.getElementById('new-user-name').value = name; document.getElementById('new-user-pass').value = pass; document.getElementById('new-user-role').value = role;
            document.getElementById('btn-user-action').innerText = "MODIFIER"; document.getElementById('btn-user-action').style.background = "var(--primary)";
        }
        function saveUser() {
            const key = document.getElementById('edit-user-key').value, name = document.getElementById('new-user-name').value, pass = document.getElementById('new-user-pass').value, role = document.getElementById('new-user-role').value;
            if(!name || !pass) return alert("Remplir tous les champs");
            if(key) database.ref('users/' + key).update({ name, pass, role }).then(() => resetUserForm());
            else database.ref('users/').push({ name, pass, role }).then(() => resetUserForm());
        }
        function resetUserForm() { document.getElementById('edit-user-key').value = ""; document.getElementById('new-user-name').value = ""; document.getElementById('new-user-pass').value = ""; document.getElementById('new-user-role').value = "OPERATEUR"; document.getElementById('btn-user-action').innerText = "ENREGISTRER"; document.getElementById('btn-user-action').style.background = "var(--success)"; }
        function searchStock() { const f = document.getElementById('stockSearchInput').value.toUpperCase(), rows = document.querySelector(".stock-table tbody").rows; for(let r of rows) r.style.display = r.cells[0].innerText.toUpperCase().includes(f) ? "" : "none"; }
        function addNewStock() {
    const n = document.getElementById('new-p-name').value.toUpperCase();
    const q = parseInt(document.getElementById('new-p-qty').value);

    if (n && !isNaN(q)) {
        database.ref('stock/' + n).set({ qty: q }).then(() => {
            // هاد السطر هو اللي كيسد النافذة أوتوماتيكياً
            document.getElementById('stockModal').style.display = 'none';
            
            // اختياري: تنظيف الخانات باش المرة الجاية تلقاهم خاويين
            document.getElementById('new-p-qty').value = "";
            alert("Pièce ajoutée avec succès !");
        });
    } else {
        alert("Veuillez remplir tous les champs !");
    }
}

		// لستة ديال الـ Tools (30 أرتيكل)
const toolsList = Array.from({length: 30}, (_, i) => `TOOL-${i + 1}`);

function updateCatalogueList() {
    const type = document.getElementById('cat-type').value;
    const selectArticle = document.getElementById('new-p-name');
    let optionsHtml = '<option value="">-- Sélectionner l\'article --</option>';

    if (type === "TOOL") {
        // إذا اختار Tools، كنعطيوه اللستة من 1 لـ 30
        toolsList.forEach(tool => {
            optionsHtml += `<option value="${tool}">${tool}</option>`;
        });
        selectArticle.innerHTML = optionsHtml;
    } else {
        // إذا اختار PIECE، كنجيبو داكشي اللي ديجا كاين فـ Stock (A001...)
        database.ref('stock/').once('value', snap => {
            if (snap.val()) {
                Object.keys(snap.val()).forEach(name => {
                    // كنفلترو باش ما يطلعوش الـ Tools وسط الـ Pieces
                    if(!name.startsWith('TOOL-')) {
                        optionsHtml += `<option value="${name}">${name}</option>`;
                    }
                });
            }
            selectArticle.innerHTML = optionsHtml;
        });
    }
}

let currentStockFilter = 'ALL'; // هادي كتعقل على الفلتر اللي اختاريتي

function filterStockDisplay(type) {
    currentStockFilter = type;
    renderStockTable(); // كنقولو ليه عاود رسم الجدول بالفلتر الجديد
}

function listenStock() { 
    database.ref('stock/').on('value', snap => { 
        window.rawStockData = snap.val(); // كنخزنو الداتا الخام باش نستعملوها فالفلتر
        renderStockTable();
        updateCatalogueList(); // هادي ديجا صاوبناها للكاتالوج
    }); 
}

function renderStockTable() {
    const list = document.getElementById('stock-list');
    if (!window.rawStockData) return;

    let html = '<table class="stock-table"><tbody>';
    
    Object.entries(window.rawStockData).forEach(([name, data]) => {
        const isTool = name.startsWith('TOOL-');
        
        // المنطق ديال الفلتر
        let show = false;
        if (currentStockFilter === 'ALL') show = true;
        else if (currentStockFilter === 'TOOL' && isTool) show = true;
        else if (currentStockFilter === 'PIECE' && !isTool) show = true;

        if (show) {
            const isLow = data.qty <= 4;
            html += `<tr class="${isLow ? 'low-stock-alert' : ''}">
                        <td>${isLow ? '⚠️ ' : ''}${name}</td>
                        <td style="text-align:right;"><b>${data.qty}</b></td>
                     </tr>`;
        }
    });
    
    list.innerHTML = html + '</tbody></table>';
}
